<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sasaOS Beta</title>
<style>
:root{
  color-scheme:light;
  --bg1:#dce9f6;--bg2:#b8cfe6;--panel:rgba(250,252,255,.88);
  --panel-solid:#f7f9fc;--text:#172333;--muted:#657386;--line:rgba(65,86,112,.18);
  --accent:#1768d2;--accent-soft:#dceaff;--hover:rgba(30,65,105,.09);
  --shadow:0 18px 50px rgba(27,45,70,.20);--taskbar:rgba(242,247,253,.83);
  --desktop-icon:rgba(255,255,255,.40);--terminal:#13202c;--terminal-text:#d7f5dc;
}
body.dark{
  color-scheme:dark;--bg1:#121a28;--bg2:#202e43;--panel:rgba(29,39,55,.91);
  --panel-solid:#202b3d;--text:#edf3fb;--muted:#a5b3c6;--line:rgba(204,221,243,.15);
  --accent:#78aaff;--accent-soft:#263d5e;--hover:rgba(220,235,255,.09);
  --shadow:0 18px 50px rgba(0,0,0,.40);--taskbar:rgba(20,28,41,.88);
  --desktop-icon:rgba(255,255,255,.045);--terminal:#0b111a;--terminal-text:#d7f5dc;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;font-family:Inter,"Yu Gothic UI","Meiryo",system-ui,sans-serif;color:var(--text)}
button,input{font:inherit}button{color:inherit;cursor:pointer}
#desktop{height:100vh;height:100dvh;width:100vw;position:relative;overflow:hidden;background:
 radial-gradient(ellipse at 18% 18%,rgba(255,255,255,.62),transparent 34%),
 radial-gradient(ellipse at 80% 78%,rgba(78,150,220,.28),transparent 35%),
 linear-gradient(135deg,var(--bg1),var(--bg2));transition:background .2s,color .2s}
body.dark #desktop{background:radial-gradient(ellipse at 20% 20%,rgba(83,113,163,.24),transparent 35%),radial-gradient(ellipse at 80% 75%,rgba(55,104,160,.22),transparent 35%),linear-gradient(135deg,var(--bg1),var(--bg2))}
#topbar{height:36px;position:absolute;inset:0 0 auto;display:flex;align-items:center;gap:15px;padding:0 14px;background:var(--panel);backdrop-filter:blur(22px);border-bottom:1px solid var(--line);z-index:1000;font-size:12px}
.brand{font-weight:800;letter-spacing:.2px;white-space:nowrap}.topmenu{display:flex;gap:13px;color:var(--muted)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:13px;white-space:nowrap}
.status-btn{border:0;background:transparent;border-radius:7px;padding:4px 6px;display:flex;align-items:center;gap:5px}
.status-btn:hover{background:var(--hover)}
#desktop-icons{position:absolute;inset:44px 0 78px 0;overflow:hidden;touch-action:none;user-select:none}
.desktop-app{position:absolute;left:14px;top:8px;width:78px;min-height:83px;border:1px solid transparent;background:transparent;border-radius:10px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;text-shadow:0 1px 4px rgba(255,255,255,.3)}
body.dark .desktop-app{text-shadow:0 1px 4px rgba(0,0,0,.5)}
.desktop-app:hover,.desktop-app.selected{background:var(--desktop-icon);border-color:var(--line)}
.appicon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:white;font-size:22px;box-shadow:0 4px 10px rgba(0,0,0,.12);flex-shrink:0}
.appicon.file{background:linear-gradient(145deg,#54a8ff,#2870d8)}.appicon.term{background:linear-gradient(145deg,#39495e,#101924)}.appicon.settings{background:linear-gradient(145deg,#aab8c9,#65758b)}.appicon.wifi{background:linear-gradient(145deg,#42c6b5,#168c9e)}.appicon.info{background:linear-gradient(145deg,#b29bff,#7659d8)}.appicon.notes{background:linear-gradient(145deg,#ffd66d,#f29a27)}.appicon.browser{background:linear-gradient(145deg,#54d7bd,#2784cb)}
#window-layer{position:absolute;inset:36px 0 76px;pointer-events:none;overflow:hidden}
.window{position:absolute;pointer-events:auto;width:min(610px,calc(100% - 24px));height:min(440px,calc(100% - 18px));min-width:min(280px,100%);min-height:min(190px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(24px);display:flex;flex-direction:column}
.window.hidden{display:none}
.titlebar{height:42px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);cursor:move;user-select:none}
.win-icon{width:25px;height:25px;border-radius:7px;display:grid;place-items:center;color:white;font-size:14px}
.win-title{font-size:13px;font-weight:700}.win-controls{margin-left:auto;display:flex;gap:5px}
.win-controls button{width:27px;height:25px;border:0;border-radius:6px;background:transparent;font-size:14px}
.win-controls button:hover{background:var(--hover)}.win-controls .close:hover{background:#d94b52;color:white}
.window-content{padding:17px;overflow:auto;flex:1;font-size:13px}
.card{border:1px solid var(--line);background:var(--panel-solid);border-radius:11px;padding:13px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:13px}.muted{color:var(--muted)}.row{display:flex;align-items:center;gap:10px}.space{justify-content:space-between}
.action{border:1px solid var(--line);background:var(--panel-solid);border-radius:8px;padding:8px 11px}.action:hover{background:var(--hover)}
.primary{background:var(--accent);color:white;border-color:transparent}.field{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel-solid);color:var(--text);padding:9px}
.toggle{width:39px;height:22px;border:0;border-radius:99px;background:#8995a4;padding:3px;transition:.15s}
.toggle:after{content:"";display:block;width:16px;height:16px;border-radius:50%;background:white;transition:.15s}
.toggle.on{background:var(--accent)}.toggle.on:after{transform:translateX(17px)}
.terminal-screen{background:var(--terminal);color:var(--terminal-text);border-radius:9px;padding:13px;height:calc(100% - 45px);min-height:180px;display:flex;flex-direction:column;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}
#term-output{overflow:auto;white-space:pre-wrap;flex:1}.term-entry{display:flex;gap:7px;margin-top:7px}.term-entry span{color:#75dba1}.term-entry input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:inherit;font:inherit}
.file-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px}.file-row:hover{background:var(--hover)}.file-emoji{font-size:21px}
#taskbar{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);height:58px;max-width:calc(100% - 20px);display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--line);border-radius:16px;background:var(--taskbar);backdrop-filter:blur(28px);box-shadow:0 10px 35px rgba(0,0,0,.17);z-index:1100}
.task-icon{width:42px;height:42px;position:relative;border:0;border-radius:10px;background:transparent;display:grid;place-items:center;flex-shrink:0}
.task-icon:hover{background:var(--hover)}.task-icon .appicon{width:34px;height:34px;border-radius:10px;font-size:19px}
.task-icon.running:after{content:"";position:absolute;bottom:1px;left:50%;transform:translateX(-50%);height:3px;width:13px;border-radius:3px;background:var(--accent)}
.task-icon.active{background:var(--hover)}
.task-icon.start .appicon{background:transparent;box-shadow:none;color:var(--accent);font-size:27px}
.task-icon .tooltip{display:none;position:absolute;bottom:51px;left:50%;transform:translateX(-50%);background:var(--panel-solid);border:1px solid var(--line);padding:5px 8px;border-radius:6px;white-space:nowrap;font-size:11px;color:var(--text)}
.task-icon:hover .tooltip{display:block}
#search-wrap{height:39px;width:clamp(125px,19vw,230px);display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel-solid);border:1px solid var(--line);border-radius:10px;cursor:text;color:var(--muted)}
#search-wrap input{border:0;outline:0;background:transparent;color:var(--text);width:100%;min-width:0;font-size:12px}
#tray{display:flex;align-items:center;gap:6px;border-left:1px solid var(--line);padding-left:10px;margin-left:3px;height:39px}
.tray-button{position:relative;border:0;background:transparent;border-radius:8px;padding:5px 6px;display:flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap}
.tray-button:hover{background:var(--hover)}
.battery-shell{width:21px;height:11px;border:1.5px solid currentColor;border-radius:3px;padding:1px;position:relative}
.battery-shell:after{content:"";position:absolute;right:-4px;top:2px;width:2px;height:5px;background:currentColor;border-radius:0 2px 2px 0}
.battery-level{height:100%;width:72%;background:#43a56a;border-radius:1px}
#start-menu,#search-panel,#quick-panel{position:absolute;z-index:1200;background:var(--panel);backdrop-filter:blur(28px);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;display:none}
#start-menu{bottom:77px;left:50%;transform:translateX(-50%);width:min(360px,calc(100% - 24px));padding:15px}
#search-panel{bottom:77px;left:50%;transform:translateX(-50%);width:min(430px,calc(100% - 24px));padding:12px}
#quick-panel{bottom:77px;right:12px;width:min(300px,calc(100% - 24px));padding:14px}
.menu-heading{font-weight:750;font-size:14px;margin-bottom:12px}.menu-apps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.menu-app{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 3px;border:0;border-radius:9px;background:transparent;font-size:11px}.menu-app:hover{background:var(--hover)}.menu-app .appicon{width:37px;height:37px}
.menu-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.power-button{border:0;border-radius:8px;background:var(--hover);padding:8px 10px;display:flex;align-items:center;gap:7px}
.power-options{display:none;position:absolute;bottom:52px;right:12px;background:var(--panel-solid);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:var(--shadow);min-width:155px}
.power-options button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px;border-radius:7px;font-size:12px}
.power-options button:hover{background:var(--hover)}
.browser-toolbar{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.browser-toolbar .field{flex:1;min-width:130px}
.browser-frame-wrap{position:relative;flex:1;min-height:180px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.browser-frame{width:100%;height:100%;min-height:260px;border:0;background:white}
.browser-help{font-size:11px;color:var(--muted);margin:0 0 8px;line-height:1.5}
.browser-home{padding:20px 10px;text-align:center}
.browser-shortcuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:9px;margin-top:18px}
.browser-shortcut{border:1px solid var(--line);background:var(--panel-solid);border-radius:10px;padding:12px 5px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.browser-shortcut span:first-child{font-size:23px}
#boot-screen{position:absolute;inset:0;z-index:4000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:linear-gradient(135deg,#111827,#263e5b);color:white;text-align:center;transition:opacity .35s}
#boot-screen .boot-logo{font-size:38px;font-weight:750;letter-spacing:1px}
#boot-screen .boot-sub{font-size:13px;opacity:.75}
#boot-screen .boot-loader{width:120px;height:3px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden;margin-top:18px}
#boot-screen .boot-loader span{display:block;width:40%;height:100%;background:#8db8ff;animation:bootload 1s ease-in-out infinite alternate}
@keyframes bootload{from{transform:translateX(-5%)}to{transform:translateX(160%)}}
#toast{position:absolute;left:50%;top:55px;transform:translateX(-50%);z-index:2000;background:var(--panel-solid);border:1px solid var(--line);box-shadow:var(--shadow);padding:10px 15px;border-radius:10px;font-size:12px;display:none;max-width:90%;text-align:center}
#sleep-screen,#shutdown-screen{position:absolute;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:linear-gradient(135deg,#111c2c,#263c59);color:white;text-align:center}
#sleep-screen button,#shutdown-screen button{margin-top:8px;background:rgba(255,255,255,.12);color:white;border:1px solid rgba(255,255,255,.3);padding:9px 14px;border-radius:9px}
#shutdown-screen .logo{font-size:36px;font-weight:800;letter-spacing:1px}
#empty-results{padding:12px;color:var(--muted);font-size:12px}
#context-menu{position:fixed;z-index:5000;display:none;min-width:190px;padding:5px;background:var(--panel);backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
#context-menu button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:9px 11px;border-radius:6px;font-size:12px;white-space:nowrap}
#context-menu button:hover{background:var(--hover)}
#context-menu .menu-sep{height:1px;background:var(--line);margin:4px 3px}
.desktop-app.dragging{opacity:.72;z-index:10;cursor:grabbing}
@media(max-width:620px){
 #topbar{gap:8px;padding:0 9px}.topmenu{display:none}.top-right{gap:7px}
 #desktop-icons{inset:44px 0 78px 0}
 #taskbar{gap:3px;padding:6px}.task-icon{width:37px;height:40px}#search-wrap{width:38px;padding:0 10px}#search-wrap input{display:none}#tray{gap:2px;padding-left:5px}.tray-button{padding:4px 3px}.tray-label{display:none}
}

.mini-logo{width:100%;height:100%;object-fit:contain;display:block}
#shutdown-screen .shutdown-logo{width:42px;height:42px;object-fit:contain;vertical-align:middle;margin-right:8px}
/* sasaOS supplied logo assets: transparent outer white area */
#boot-screen .boot-logos{display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,30px);width:min(360px,90vw);margin-bottom:8px}
#boot-screen .boot-logos img{width:clamp(140px,30vw,260px);max-height:38vh;object-fit:contain;border-radius:8px}
.about-logos{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin:0 auto 14px}
.about-logos img{width:min(70%,190px);max-height:145px;object-fit:contain;border-radius:8px}
.settings-os-logo{display:flex;align-items:center;gap:12px}
.settings-os-logo img{width:88px;height:88px;object-fit:contain;border-radius:8px}
.task-icon.start .main-logo{width:34px;height:34px;object-fit:contain;border-radius:8px}
@media(max-width:600px){#boot-screen .boot-logos{gap:8px}#boot-screen .boot-logos img{width:40vw}.about-logos img{width:42%}}
</style>
</head>

<script>
const apps={
 files:{title:"ファイル",icon:"▰",cls:"file",w:520,h:390},
 terminal:{title:"ターミナル",icon:"›_",cls:"term",w:570,h:370},
 settings:{title:"設定",icon:"⚙",cls:"settings",w:520,h:410},
 wifi:{title:"Wi-Fi",icon:"⌁",cls:"wifi",w:430,h:350},
 notes:{title:"メモ",icon:"▤",cls:"notes",w:500,h:390},
 about:{title:"sasaOSについて",icon:"●",cls:"info",w:440,h:330},
 browser:{title:"ブラウザー",icon:"🌐",cls:"browser",w:850,h:570}
};
const layer=document.getElementById('window-layer');
let z=10,winCount=0,windows={},wifiOn=true,theme=localStorage.getItem('sasa-theme')||'light',toastTimer;
let noteText=localStorage.getItem('sasa-note')||'sasaOS Betaのアイデアを書こう...';
document.body.classList.toggle('dark',theme==='dark');
// デスクトップアイコンの初期配置とドラッグ移動
const desktopIcons=document.getElementById('desktop-icons');
const iconPositions={};
function arrangeDesktopIcons(){
 const items=[...desktopIcons.querySelectorAll('.desktop-app')];
 const areaH=Math.max(100,desktopIcons.clientHeight), areaW=Math.max(100,desktopIcons.clientWidth);
 const columns=Math.max(1,Math.floor(areaW/90));
 items.forEach((el,i)=>{
  const saved=localStorage.getItem('sasa-icon-'+el.dataset.app);
  let x,y;
  if(saved){try{const pos=JSON.parse(saved);x=pos.x;y=pos.y}catch(_){x=null;y=null}}
  if(!Number.isFinite(x)||!Number.isFinite(y)){x=14+(Math.floor(i/Math.max(1,Math.floor(areaH/92)))*90);y=8+(i%Math.max(1,Math.floor(areaH/92)))*92}
  x=Math.max(0,Math.min(areaW-el.offsetWidth,x));y=Math.max(0,Math.min(areaH-el.offsetHeight,y));
  el.style.left=x+'px';el.style.top=y+'px';iconPositions[el.dataset.app]={x,y};
 });
}

function hideContextMenu(){const m=document.getElementById('context-menu');m.style.display='none';m.innerHTML='';m.dataset.app='';}
function showContextMenu(x,y,items,appId=''){
 const m=document.getElementById('context-menu');m.innerHTML='';m.dataset.app=appId;
 items.forEach((item,i)=>{if(item==='separator'){const sep=document.createElement('div');sep.className='menu-sep';m.appendChild(sep);return}const b=document.createElement('button');b.type='button';b.textContent=item.label;b.addEventListener('click',()=>{hideContextMenu();item.action&&item.action()});m.appendChild(b)});
 m.style.display='block';const r=m.getBoundingClientRect();m.style.left=Math.max(6,Math.min(x,window.innerWidth-r.width-6))+'px';m.style.top=Math.max(6,Math.min(y,window.innerHeight-r.height-6))+'px';
}
function desktopContextItems(appId){
 if(appId){return [
  {label:'開く',action:()=>openApp(appId)},
  ...(windows[appId]&&windows[appId].isConnected?[{label:'アプリを閉じる',action:()=>{windows[appId].remove();delete windows[appId];syncTaskbar();showToast((apps[appId]?.title||appId)+'を閉じました')}}]:[]),
  {label:'名前：'+(apps[appId]?.title||appId),action:()=>showToast('アプリ名はこの試作では変更できません')},
  'separator',{label:'デスクトップに整列',action:()=>{localStorage.removeItem('sasa-icon-'+appId);arrangeDesktopIcons()}},
  {label:'位置をリセット',action:()=>{localStorage.removeItem('sasa-icon-'+appId);arrangeDesktopIcons()}}
 ];}
 return [
  {label:'表示を更新',action:()=>{arrangeDesktopIcons();showToast('デスクトップを整えました')}},
  {label:'アイコンを整列',action:()=>{document.querySelectorAll('.desktop-app').forEach(el=>localStorage.removeItem('sasa-icon-'+el.dataset.app));arrangeDesktopIcons()}},
  'separator',{label:'設定を開く',action:()=>openApp('settings')},
  {label:'全画面表示の切り替え',action:async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(_){showToast('この環境では全画面表示を開始できません')}}}
 ];
}
function installDesktopInteractions(){
 arrangeDesktopIcons();
 desktopIcons.querySelectorAll('.desktop-app').forEach(el=>{
  let start=null,moved=false;
  el.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();showContextMenu(e.clientX,e.clientY,desktopContextItems(el.dataset.app),el.dataset.app)});
  el.addEventListener('pointerdown',e=>{if(e.button!==0)return;start={x:e.clientX,y:e.clientY,left:parseFloat(el.style.left)||0,top:parseFloat(el.style.top)||0,id:e.pointerId};moved=false;el.setPointerCapture(e.pointerId)});
  el.addEventListener('pointermove',e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;if(!moved)return;el.classList.add('dragging');const maxX=Math.max(0,desktopIcons.clientWidth-el.offsetWidth),maxY=Math.max(0,desktopIcons.clientHeight-el.offsetHeight);const x=Math.max(0,Math.min(maxX,start.left+dx)),y=Math.max(0,Math.min(maxY,start.top+dy));el.style.left=x+'px';el.style.top=y+'px';iconPositions[el.dataset.app]={x,y}});
  const finish=e=>{if(!start)return;if(moved){const pos=iconPositions[el.dataset.app];localStorage.setItem('sasa-icon-'+el.dataset.app,JSON.stringify(pos));el.dataset.dragged='true';setTimeout(()=>delete el.dataset.dragged,0)}start=null;el.classList.remove('dragging')};
  el.addEventListener('pointerup',finish);el.addEventListener('pointercancel',finish);
  el.addEventListener('click',e=>{if(el.dataset.dragged==='true'){e.preventDefault();e.stopImmediatePropagation();delete el.dataset.dragged}},true);
 });
 desktopIcons.addEventListener('contextmenu',e=>{if(e.target.closest('.desktop-app'))return;e.preventDefault();showContextMenu(e.clientX,e.clientY,desktopContextItems())});
 document.getElementById('desktop').addEventListener('contextmenu',e=>{if(e.target.closest('.desktop-app')||e.target.closest('#context-menu')||e.target.closest('.window')||e.target.closest('#taskbar')||e.target.closest('#topbar'))return;e.preventDefault();showContextMenu(e.clientX,e.clientY,desktopContextItems())});
 document.addEventListener('pointerdown',e=>{if(!e.target.closest('#context-menu'))hideContextMenu()});
}
function resizeLayout(){
 const w=window.innerWidth,h=window.innerHeight;
 document.querySelectorAll('.window').forEach(win=>{
  if(win.dataset.maximized==='true')return;
  const maxX=Math.max(0,layer.clientWidth-win.offsetWidth),maxY=Math.max(0,layer.clientHeight-win.offsetHeight);
  win.style.left=Math.max(0,Math.min(maxX,parseFloat(win.style.left)||0))+'px';
  win.style.top=Math.max(0,Math.min(maxY,parseFloat(win.style.top)||0))+'px';
 });
 if(document.fullscreenElement)document.getElementById('desktop').style.height='100dvh';
}
window.addEventListener('resize',()=>{arrangeDesktopIcons();resizeLayout();hideContextMenu()});
document.addEventListener('fullscreenchange',()=>{resizeLayout();showToast(document.fullscreenElement?'全画面表示にしました':'全画面表示を終了しました')});
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',2500)}
function timeUpdate(){const d=new Date(),time=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});document.getElementById('top-clock').textContent=time;document.getElementById('tray-time').textContent=time;document.getElementById('tray-clock').title=d.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'})}
timeUpdate();setInterval(timeUpdate,1000);
function updateWifi(){document.getElementById('top-wifi-text').textContent=wifiOn?'Wi-Fi':'オフ';document.getElementById('tray-wifi-text').textContent=wifiOn?'接続':'オフ';document.getElementById('quick-wifi-caption').textContent=wifiOn?'接続状態：デモ表示（実際の接続は未確認）':'Wi-Fi表示：オフ（デモ）';document.getElementById('quick-wifi-toggle').classList.toggle('on',wifiOn);document.getElementById('wifi-strength-text').textContent=wifiOn?'良好':'未接続';document.getElementById('wifi-strength-bar').style.width=wifiOn?'82%':'0%';document.getElementById('wifi-strength-bar').style.background=wifiOn?'#45a56b':'#8995a4'}
function contentFor(id){

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openApp(id){
 if(!apps[id])return;
 document.getElementById('start-menu').style.display='none';document.getElementById('search-panel').style.display='none';document.getElementById('quick-panel').style.display='none';
 if(windows[id]&&windows[id].isConnected){const w=windows[id];if(w.classList.contains('hidden'))w.classList.remove('hidden');w.style.zIndex=++z;syncTaskbar();if(id==='terminal'){const i=w.querySelector('#term-input');if(i)i.focus()}return}
 const a=apps[id],w=document.createElement('section');w.className='window';w.dataset.app=id;w.style.width=`min(${a.w}px, calc(100vw - 24px))`;w.style.height=`min(${a.h}px, calc(100% - 18px))`;w.style.left=Math.max(0,Math.min(layer.clientWidth-Math.min(a.w,layer.clientWidth),70+winCount*25))+'px';w.style.top=Math.max(0,Math.min(layer.clientHeight-Math.min(a.h,layer.clientHeight),30+winCount*20))+'px';w.style.zIndex=++z;winCount++;
 w.innerHTML=`<div class="titlebar"><span class="win-icon appicon ${a.cls}">${a.icon}</span><span class="win-title">${a.title}</span><div class="win-controls"><button data-action="min" title="最小化">—</button><button data-action="max" title="最大化">□</button><button data-action="close" class="close" title="閉じる">×</button></div></div><div class="window-content">${contentFor(id)}</div>`;
 layer.appendChild(w);windows[id]=w;
 w.addEventListener('pointerdown',()=>{w.style.zIndex=++z;syncTaskbar()});
 const bar=w.querySelector('.titlebar');let drag=null;
 bar.addEventListener('pointerdown',e=>{if(e.target.closest('.win-controls'))return;if(w.dataset.maximized==='true')return;drag={x:e.clientX-w.offsetLeft,y:e.clientY-w.offsetTop};bar.setPointerCapture(e.pointerId)});
 bar.addEventListener('pointermove',e=>{if(!drag)return;const maxX=Math.max(0,layer.clientWidth-w.offsetWidth),maxY=Math.max(0,layer.clientHeight-w.offsetHeight);w.style.left=Math.max(0,Math.min(maxX,e.clientX-layer.getBoundingClientRect().left-drag.x))+'px';w.style.top=Math.max(0,Math.min(maxY,e.clientY-layer.getBoundingClientRect().top-drag.y))+'px'});
 bar.addEventListener('pointerup',()=>drag=null);bar.addEventListener('pointercancel',()=>drag=null);
 w.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{
   const act=b.dataset.action;
   if(act==='close'){w.remove();delete windows[id]}
   if(act==='min')w.classList.add('hidden');
   if(act==='max'){if(w.dataset.maximized==='true'){w.style.left=w.dataset.oldLeft;w.style.top=w.dataset.oldTop;w.style.width=w.dataset.oldWidth;w.style.height=w.dataset.oldHeight;w.dataset.maximized='false'}else{w.dataset.oldLeft=w.style.left;w.dataset.oldTop=w.style.top;w.dataset.oldWidth=w.style.width;w.dataset.oldHeight=w.style.height;w.style.left='0px';w.style.top='0px';w.style.width='100%';w.style.height='100%';w.style.borderRadius='0';w.dataset.maximized='true'}if(w.dataset.maximized!=='true')w.style.borderRadius='12px'}
   syncTaskbar();
 }));
 w.querySelectorAll('[data-app]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.app)));
 if(id==='settings'){w.querySelector('#theme-toggle').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';localStorage.setItem('sasa-theme',theme);document.body.classList.toggle('dark',theme==='dark');const wasTop=w.style.zIndex;w.remove();delete windows.settings;openApp('settings');windows.settings.style.zIndex=wasTop;showToast(theme==='dark'?'ダークモードにしました':'ライトモードにしました')});w.querySelector('#settings-about').addEventListener('click',()=>openApp('about'))}
 if(id==='wifi'){w.querySelector('#wifi-toggle').addEventListener('click',()=>{wifiOn=!wifiOn;updateWifi();w.remove();delete windows.wifi;openApp('wifi')})}
 if(id==='notes'){const ta=w.querySelector('#note-area'),status=w.querySelector('#note-status');ta.addEventListener('input',()=>{noteText=ta.value;localStorage.setItem('sasa-note',noteText);status.textContent='保存しました'});w.querySelector('#save-note').addEventListener('click',()=>{noteText=ta.value;localStorage.setItem('sasa-note',noteText);status.textContent='保存しました';showToast('メモを保存しました')})}
 if(id==='browser'){
   const address=w.querySelector('#browser-address'),frame=w.querySelector('#browser-frame'),home=w.querySelector('#browser-homepage');
   let historyList=[],historyIndex=-1;
   const normalize=(raw)=>{let v=raw.trim();if(!v)return 'https://www.google.com';if(/^https?:\/\//i.test(v))return v;if(/^localhost(?::\d+)?/i.test(v))return 'http://'+v;if(v.includes('.')&&!v.includes(' '))return 'https://'+v;return 'https://www.google.com/search?q='+encodeURIComponent(v)};
   const navigate=(raw,record=true)=>{const url=normalize(raw);address.value=url;home.style.display='none';frame.style.display='block';frame.src=url;if(record){historyList=historyList.slice(0,historyIndex+1);historyList.push(url);historyIndex=historyList.length-1;}localStorage.setItem('sasa-browser-last',url);};
   w.querySelector('#browser-go').addEventListener('click',()=>navigate(address.value));address.addEventListener('keydown',e=>{if(e.key==='Enter')navigate(address.value)});
   w.querySelector('#browser-external').addEventListener('click',()=>{const url=normalize(address.value);window.open(url,'_blank','noopener,noreferrer')});
   w.querySelector('#browser-reload').addEventListener('click',()=>{try{frame.contentWindow.location.reload()}catch(e){frame.src=frame.src}});
   w.querySelector('#browser-home').addEventListener('click',()=>{frame.src='about:blank';frame.style.display='none';home.style.display='block';address.value='https://www.google.com'});
   w.querySelector('#browser-back').addEventListener('click',()=>{if(historyIndex>0){historyIndex--;navigate(historyList[historyIndex],false)}});
   w.querySelector('#browser-forward').addEventListener('click',()=>{if(historyIndex<historyList.length-1){historyIndex++;navigate(historyList[historyIndex],false)}});
   w.querySelectorAll('[data-url]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.url)));
   const last=localStorage.getItem('sasa-browser-last');if(last){address.value=last;}
 }
 if(id==='terminal'){const input=w.querySelector('#term-input'),out=w.querySelector('#term-output');const run=()=>{const cmd=input.value.trim();if(!cmd)return;out.textContent+=`\nguest@sasaos:~$ ${cmd}\n`;let result='コマンドが見つかりません。help で一覧を確認してください。';if(cmd==='help')result='利用可能なコマンド:\n  help   コマンド一覧\n  about  sasaOSの情報\n  date   現在日時\n  browser ブラウザーを開く\n  clear  画面を消去';else if(cmd==='about')result='sasaOS Beta — Browser Prototype\nBuild 0.2.0-web';else if(cmd==='date')result=new Date().toLocaleString('ja-JP');else if(cmd==='browser'){openApp('browser');result='ブラウザーを開きました。'}else if(cmd==='clear'){out.textContent='';input.value='';return}else if(cmd==='')result='';out.textContent+=result+'\n';input.value='';out.scrollTop=out.scrollHeight};input.addEventListener('keydown',e=>{if(e.key==='Enter')run()});setTimeout(()=>input.focus(),50)}
 syncTaskbar();
}
function syncTaskbar(){document.querySelectorAll('#taskbar [data-app]').forEach(b=>{const id=b.dataset.app,open=!!(windows[id]&&windows[id].isConnected),visible=open&&!windows[id].classList.contains('hidden');b.classList.toggle('running',open);b.classList.toggle('active',visible)});}
document.querySelectorAll('[data-app]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.app)));
// Taskbar app icons support right-click context actions.
document.querySelectorAll('#taskbar [data-app]').forEach(btn=>{
 btn.addEventListener('contextmenu',e=>{
  e.preventDefault();e.stopPropagation();
  const id=btn.dataset.app, isOpen=!!(windows[id]&&windows[id].isConnected);
  const items=[{label:'開く／切り替え',action:()=>openApp(id)}];
  if(isOpen)items.push({label:'アプリを閉じる',action:()=>{const w=windows[id];if(w&&w.isConnected)w.remove();delete windows[id];syncTaskbar();showToast((apps[id]?.title||id)+'を閉じました')}});
  else items.push({label:'現在は起動していません',action:()=>showToast('アプリは起動していません')});
  showContextMenu(e.clientX,e.clientY,items,id);
 });
});

document.getElementById('start-button').addEventListener('click',()=>{const m=document.getElementById('start-menu');m.style.display=m.style.display==='block'?'none':'block';document.getElementById('search-panel').style.display='none';document.getElementById('quick-panel').style.display='none'});
document.getElementById('power-menu-btn').addEventListener('click',()=>{const p=document.getElementById('power-options');p.style.display=p.style.display==='block'?'none':'block'});
document.querySelectorAll('[data-power]').forEach(b=>b.addEventListener('click',()=>{document.getElementById('start-menu').style.display='none';document.getElementById('power-options').style.display='none';if(b.dataset.power==='sleep'){document.getElementById('sleep-screen').style.display='flex'}else if(b.dataset.power==='shutdown'){document.getElementById('shutdown-screen').style.display='flex'}else{document.getElementById('shutdown-screen').style.display='none';const bs=document.getElementById('boot-screen');bs.style.display='flex';bs.style.opacity='1';setTimeout(()=>{bs.style.opacity='0';setTimeout(()=>bs.style.display='none',380);showToast('再起動しました（デモ）')},1100)}}));
document.getElementById('wake-button').addEventListener('click',()=>document.getElementById('sleep-screen').style.display='none');
document.getElementById('sleep-screen').addEventListener('click',e=>{if(e.target.id==='sleep-screen')e.currentTarget.style.display='none'});
document.getElementById('boot-button').addEventListener('click',()=>{document.getElementById('shutdown-screen').style.display='none';const b=document.getElementById('boot-screen');b.style.display='flex';b.style.opacity='1';setTimeout(()=>{b.style.opacity='0';setTimeout(()=>b.style.display='none',380);showToast('sasaOS Beta（ブラウザーデモ）を再開しました')},1100)});
function toggleQuick(){const q=document.getElementById('quick-panel');q.style.display=q.style.display==='block'?'none':'block';document.getElementById('start-menu').style.display='none';document.getElementById('search-panel').style.display='none'}
document.getElementById('tray-wifi').addEventListener('click',toggleQuick);document.getElementById('top-wifi').addEventListener('click',toggleQuick);
document.getElementById('quick-wifi-toggle').addEventListener('click',()=>{wifiOn=!wifiOn;updateWifi()});
document.getElementById('tray-battery').addEventListener('click',()=>{toggleQuick();showToast('バッテリー残量は現在デモ値（72%）です')});
document.getElementById('task-search').addEventListener('focus',()=>{document.getElementById('search-panel').style.display='block';document.getElementById('start-menu').style.display='none';document.getElementById('quick-panel').style.display='none';document.getElementById('search-input').value=document.getElementById('task-search').value;renderSearch()});
document.getElementById('search-wrap').addEventListener('click',()=>{document.getElementById('search-panel').style.display='block';document.getElementById('search-input').focus();renderSearch()});
document.getElementById('search-input').addEventListener('input',renderSearch);
document.getElementById('task-search').addEventListener('input',e=>{document.getElementById('search-panel').style.display='block';document.getElementById('search-input').value=e.target.value;renderSearch()});
function renderSearch(){const q=document.getElementById('search-input').value.toLowerCase(),r=document.getElementById('search-results');r.innerHTML='';let found=0;Object.entries(apps).filter(([id,a])=>(a.title+' '+id+' sasaos').toLowerCase().includes(q)).forEach(([id,a])=>{found++;const b=document.createElement('button');b.className='menu-app';b.innerHTML=`<span class="appicon ${a.cls}">${a.icon}</span>${a.title}`;b.addEventListener('click',()=>openApp(id));r.appendChild(b)});if(!found)r.innerHTML='<div id="empty-results">一致するアプリがありません</div>'}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#start-menu')&&!e.target.closest('#start-button')){document.getElementById('start-menu').style.display='none';document.getElementById('power-options').style.display='none'}if(!e.target.closest('#quick-panel')&&!e.target.closest('#tray-wifi')&&!e.target.closest('#top-wifi'))document.getElementById('quick-panel').style.display='none';if(!e.target.closest('#search-panel')&&!e.target.closest('#search-wrap')&&!e.target.closest('#task-search'))document.getElementById('search-panel').style.display='none'});
installDesktopInteractions();updateWifi();syncTaskbar();
window.addEventListener('load',()=>setTimeout(()=>{const b=document.getElementById('boot-screen');b.style.opacity='0';setTimeout(()=>b.style.display='none',380)},1100));
</script>
</body>
</html>
